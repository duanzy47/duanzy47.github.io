baseURL = 'https://duanzy47.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
hasCJKLanguage = true
title = 'Maison Hatoyama'
theme = 'PaperMod'
disqusShortname = 'julian-10'
enableRobotsTXT = true

[params]
  description = '关于事物、世界、AI 与社会现象的思考。'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowToc = false
  disableSpecial1stPost = true
  comments = true
  DateFormat = '2006-01-02'

  [params.homeInfoParams]
    Title = 'Maison Hatoyama'
    Content = '关于事物、世界、AI，以及各种社会现象的思考。'

  [params.fuseOpts]
    keys = ['title', 'permalink', 'summary', 'content']

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
